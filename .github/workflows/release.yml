name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            archive: tar
          - rid: osx-x64
            # macos-latest is ARM64. The OpenCode --single build must run on an
            # Intel host to emit its x64 binary.
            os: macos-13
            archive: tar
          - rid: osx-arm64
            os: macos-latest
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          dotnet publish Axiom.Cli/Axiom.Cli.csproj
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -c Release
          -o publish/${{ matrix.rid }}

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath axiom-cli-${{ matrix.rid }}.zip

      - name: Package (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: tar -czf axiom-cli-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} .

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build Axiom Code runtime
        shell: bash
        run: |
          git clone --depth 1 --branch v1.18.18 https://github.com/anomalyco/opencode.git opencode-source
          git -C opencode-source apply "$GITHUB_WORKSPACE/assets/opencode/axiom-code-logo.patch"
          bun install --cwd opencode-source --frozen-lockfile
          bun run --cwd opencode-source/packages/opencode build --single
          rid="${{ matrix.rid }}"
          arch="${rid##*-}"
          case "$rid" in
            win-*) target="windows-$arch"; extension=".exe" ;;
            osx-*) target="darwin-$arch"; extension="" ;;
            *) target="linux-$arch"; extension="" ;;
          esac
          mkdir axiom-code-runtime
          cp "opencode-source/packages/opencode/dist/opencode-$target/bin/opencode$extension" "axiom-code-runtime/opencode$extension"
          (cd axiom-code-runtime && zip -r "../axiom-code-runtime-$rid.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: axiom-cli-${{ matrix.rid }}
          path: |
            axiom-cli-*
            axiom-code-runtime-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
