name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            archive: tar
          - rid: osx-x64
            # macos-latest is ARM64. The OpenCode --single build must run on an
            # Intel host to emit its x64 binary. macos-13 was retired by GitHub,
            # which silently left this job queued until it was cancelled -- and a
            # cancelled matrix job skipped the release job entirely, so every tag
            # after v1.14.4 published Windows-only assets.
            os: macos-15-intel
            archive: tar
          - rid: osx-arm64
            os: macos-latest
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          dotnet publish Axiom.Cli/Axiom.Cli.csproj
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -c Release
          -o publish/${{ matrix.rid }}

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath axiom-cli-${{ matrix.rid }}.zip

      - name: Package (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: tar -czf axiom-cli-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} .

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build Axiom Code runtime
        shell: bash
        run: |
          # Single source of truth for the pinned runtime, so the branded build can never drift
          # from the version the CLI checks for and installs at runtime.
          opencode_version="$(grep -oE 'PinnedRuntimeVersion = "[0-9.]+"' Axiom.Cli/OpenCodeRunner.cs | grep -oE '[0-9.]+')"
          if [ -z "$opencode_version" ]; then
            echo "Could not read PinnedRuntimeVersion from Axiom.Cli/OpenCodeRunner.cs" >&2
            exit 1
          fi
          echo "Building Axiom Code on OpenCode v$opencode_version"
          git clone --depth 1 --branch "v$opencode_version" https://github.com/anomalyco/opencode.git opencode-source
          git -C opencode-source apply "$GITHUB_WORKSPACE/assets/opencode/axiom-code-logo.patch"
          git -C opencode-source apply "$GITHUB_WORKSPACE/assets/opencode/axiom-code-experience.patch"
          git -C opencode-source apply "$GITHUB_WORKSPACE/assets/opencode/axiom-code-persistence.patch"
          bun install --cwd opencode-source --frozen-lockfile
          bun run --cwd opencode-source/packages/opencode build --single
          rid="${{ matrix.rid }}"
          arch="${rid##*-}"
          case "$rid" in
            win-*) target="windows-$arch"; extension=".exe" ;;
            osx-*) target="darwin-$arch"; extension="" ;;
            *) target="linux-$arch"; extension="" ;;
          esac
          mkdir axiom-code-runtime
          cp "opencode-source/packages/opencode/dist/opencode-$target/bin/opencode$extension" "axiom-code-runtime/opencode$extension"
          if [[ "$rid" == win-* ]]; then
            pwsh -NoProfile -Command "Compress-Archive -Path 'axiom-code-runtime/*' -DestinationPath 'axiom-code-runtime-$rid.zip' -Force"
          else
            (cd axiom-code-runtime && zip -r "../axiom-code-runtime-$rid.zip" .)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: axiom-cli-${{ matrix.rid }}
          path: |
            axiom-cli-*
            axiom-code-runtime-*.zip

  release:
    needs: build
    # Publish whatever did build instead of skipping the release entirely when one platform
    # breaks, then fail loudly below so a partial release is never mistaken for a complete one.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

      - name: Verify every platform shipped
        shell: bash
        run: |
          missing=0
          for rid in win-x64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            case "$rid" in
              win-*) cli="axiom-cli-$rid.zip" ;;
              *) cli="axiom-cli-$rid.tar.gz" ;;
            esac
            for asset in "$cli" "axiom-code-runtime-$rid.zip"; do
              if [ ! -f "artifacts/$asset" ]; then
                echo "::error::Release is missing $asset"
                missing=1
              fi
            done
          done
          exit "$missing"
